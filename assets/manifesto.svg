<svg xmlns="http://www.w3.org/2000/svg" width="830" height="110" viewBox="0 0 830 110" role="img" aria-labelledby="title">
  <title id="title">Small tools. Clean history. Documented decisions.</title>
  <style>
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect x="1" y="1" width="828" height="108" rx="12" fill="#012929" stroke="#4FD1C5" stroke-width="2"/>
  <text x="415" y="52" text-anchor="middle" class="m" font-size="22" font-weight="700" fill="#E3F1EF">Small tools. Clean history. Documented decisions.</text>
  <text x="415" y="80" text-anchor="middle" class="m" font-size="14" fill="#7FB5AE">Every library does one thing well. Every commit explains why.</text>
